<!DOCTYPE html>

<html>
   <head>
      <title>File Metadata</title>
      <link rel="shortcut icon" href="https://cdn.freecodecamp.org/universal/favicons/favicon-32x32.png" type="image/x-icon"/>
      <link href="https://fonts.googleapis.com/css?family=Roboto" rel="stylesheet" type="text/css">
      <link href="/public/style.css" rel="stylesheet" type="text/css">
   </head>

   <body>
      <div class="container">
        <h1>API Project: File Metadata Microservice</h1>

        <h2>Usage:</h2>
        <p>
          Please Upload a File ...
        </p>
        <div class="view">
          <h3 id="output"></h3>
          <form enctype="multipart/form-data" method="POST" action="/api/fileanalyse">
            <input id="inputfield" type="file" name="upfile">
            <input id="button" type="submit" value="Upload">
          </form>
        </div>
      </div>
      <div class="footer">
        <p>
          by
          <a href="http://www.freecodecamp.com">freeCodeCamp</a>
        </p>
      </div>
      <script>
        document.querySelector('form').addEventListener('submit', function(e) {
          e.preventDefault();
          var formData = new FormData(this);
          var xhr = new XMLHttpRequest();
          xhr.open('POST', '/api/fileanalyse', true);
          xhr.onload = function() {
            if (xhr.status >= 200 && xhr.status < 300) {
              document.querySelector('#output').innerHTML = xhr.responseText;
            } else {
              document.querySelector('#output').innerHTML = JSON.stringify({error: 'Upload failed'});
            }
          };
          xhr.onerror = function() {
            document.querySelector('#output').innerHTML = JSON.stringify({error: 'Request error'});
          };
          xhr.send(formData);
        });
      </script>
   </body>
</html>
