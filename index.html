<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Quote Machine</title>
    <script src="https://cdn.freecodecamp.org/testable-projects-fcc/v1/bundle.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        #quote-box {
            background: white;
            border-radius: 10px;
            padding: 40px;
            max-width: 600px;
            width: 90%;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            text-align: center;
            margin: 0 auto;
        }

        #text {
            font-size: 28px;
            font-weight: 300;
            line-height: 1.6;
            margin-bottom: 20px;
            color: #333;
            min-height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #author {
            font-size: 20px;
            font-weight: 500;
            color: #666;
            margin-bottom: 30px;
            text-align: right;
            font-style: italic;
        }

        #author::before {
            content: "— ";
        }

        .button-container {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            align-items: center;
            flex-wrap: wrap;
        }

        #new-quote {
            background-color: #667eea;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        #new-quote:hover {
            background-color: #764ba2;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        #new-quote:active {
            transform: translateY(0);
        }

        #new-quote:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #tweet-quote {
            background-color: #1da1f2;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            gap: 8px;
        }

        #tweet-quote:hover {
            background-color: #1a91da;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(29, 161, 242, 0.4);
        }

        #tweet-quote:active {
            transform: translateY(0);
        }

        code {
            font-family: source-code-pro, Menlo, Monaco, Consolas, 'Courier New', monospace;
        }
    </style>
</head>
<body>
    <div id="quote-box">
        <div id="text">Loading...</div>
        <div id="author"></div>
        <div class="button-container">
            <a id="tweet-quote" href="https://twitter.com/intent/tweet" target="_blank" rel="noopener noreferrer">
                <span>𝕏</span>
                <span>Tweet</span>
            </a>
            <button id="new-quote">New Quote</button>
        </div>
    </div>

    <script>
        const quotes = [
            {
                text: 'The only way to do great work is to love what you do.',
                author: 'Steve Jobs'
            },
            {
                text: 'Innovation distinguishes between a leader and a follower.',
                author: 'Steve Jobs'
            },
            {
                text: 'Life is what happens when you\'re busy making other plans.',
                author: 'John Lennon'
            },
            {
                text: 'The future belongs to those who believe in the beauty of their dreams.',
                author: 'Eleanor Roosevelt'
            },
            {
                text: 'It is during our darkest moments that we must focus to see the light.',
                author: 'Aristotle'
            },
            {
                text: 'The only impossible journey is the one you never begin.',
                author: 'Tony Robbins'
            },
            {
                text: 'Success is not final, failure is not fatal.',
                author: 'Winston Churchill'
            },
            {
                text: 'Believe you can and you\'re halfway there.',
                author: 'Theodore Roosevelt'
            },
            {
                text: 'The best time to plant a tree was 20 years ago. The second best time is now.',
                author: 'Chinese Proverb'
            },
            {
                text: 'Your time is limited, don\'t waste it living someone else\'s life.',
                author: 'Steve Jobs'
            },
            {
                text: 'The way to get started is to quit talking and begin doing.',
                author: 'Walt Disney'
            },
            {
                text: 'Don\'t watch the clock; do what it does. Keep going.',
                author: 'Sam Levenson'
            }
        ];

        let currentQuote = {};

        const textElement = document.getElementById('text');
        const authorElement = document.getElementById('author');
        const newQuoteBtn = document.getElementById('new-quote');
        const tweetLink = document.getElementById('tweet-quote');

        function getRandomQuote() {
            return quotes[Math.floor(Math.random() * quotes.length)];
        }

        function displayQuote(quote) {
            currentQuote = quote;
            textElement.textContent = quote.text;
            authorElement.textContent = quote.author;
            updateTweetLink();
        }

        function updateTweetLink() {
            const tweetText = `"${currentQuote.text}" — ${currentQuote.author}`;
            tweetLink.href = `https://twitter.com/intent/tweet?text=${encodeURIComponent(tweetText)}`;
        }

        async function fetchNewQuote() {
            newQuoteBtn.disabled = true;
            try {
                const response = await fetch('https://api.quotable.io/random');
                if (response.ok) {
                    const data = await response.json();
                    displayQuote({
                        text: data.content,
                        author: data.author
                    });
                } else {
                    const quote = getRandomQuote();
                    displayQuote(quote);
                }
            } catch (error) {
                console.error('Error fetching quote from API, using local quotes:', error);
                const quote = getRandomQuote();
                displayQuote(quote);
            } finally {
                newQuoteBtn.disabled = false;
            }
        }

        newQuoteBtn.addEventListener('click', fetchNewQuote);

        // Load initial quote
        fetchNewQuote();
    </script>
</body>
</html>
